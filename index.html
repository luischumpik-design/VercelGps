<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR por ubicación - LocAR.js</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      pointer-events: none;
    }
    #overlay h3 {
      margin: 0 0 6px 0;
      font-size: 16px;
    }
    #legend {
      font-size: 12px;
      color: #ccc;
      margin-top: 6px;
    }
    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      padding: 16px 30px;
      font-size: 18px;
      font-weight: bold;
      background-color: #0070f3;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <button id="startBtn">INICIAR AR</button>

  <div id="overlay" style="display: none;">
    <h3>AR por ubicación — Router TI</h3>
    <div id="gps">Buscando señal GPS...</div>
    <div id="status">Presiona INICIAR AR</div>
    <div id="legend">
      Calibración: rojo=Norte, amarillo=Sur, celeste=Oeste, verde=Este.<br/>
      El modelo 3D representa el Laboratorio de Redes.
    </div>
  </div>

  <canvas id="cameraCanvas"></canvas>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
